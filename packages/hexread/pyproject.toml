[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hexread"
version = "0.1.0"
description = "Official Python client for the HexRead API, which converts PDFs and images to Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "HexWorld Solutions GmbH", email = "support@hexread.com" }]
keywords = ["pdf", "ocr", "markdown", "rag", "document parsing", "pdf to markdown"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://hexread.com"
Documentation = "https://hexread.com/api"
Source = "https://github.com/HexWorldEU/hexread-python"

[dependency-groups]
# Tests use httpx.MockTransport, so there is no HTTP-mocking dependency to install.
dev = ["ruff>=0.16", "pytest>=8.4", "pytest-asyncio>=1.4"]

# The wheel carries src/hexread only: the py.typed marker rides along, tests do not.
[tool.hatch.build.targets.wheel]
packages = ["src/hexread"]

[tool.hatch.build.targets.sdist]
only-include = ["src/hexread", "README.md", "LICENSE"]

[tool.ruff]
# See ruff.toml at the repo root: markdown is excluded so the formatter leaves the
# README's fenced Python examples, and their aligned comment columns, alone.
extend-exclude = ["*.md"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "N", "SIM", "UP", "W"]

[tool.ruff.lint.flake8-builtins]
# Both names mirror the API error envelope on purpose: `type` is one of its fields, and
# PermissionError is one of its error classes. Shadowing the builtins here is the API contract.
ignorelist = ["type", "PermissionError"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
